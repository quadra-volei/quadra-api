# Fly.io configuration for the Quadra API — the always-on test environment.
#
# First deploy (run from this folder):
#   fly apps create <name>            # then put the same name in `app` below
#   fly secrets set \
#     ConnectionStrings__Default="Host=...;Port=5432;Database=...;Username=...;Password=...;SSL Mode=Require" \
#     Auth__Jwt__SigningKey="<random, 32+ bytes>" \
#     Auth__Google__ClientId="<Google Web OAuth client id>"
#   fly deploy
#
# Secrets never go in this file. The connection string must be in the Npgsql
# key=value form shown above (not a postgres:// URL), and the database must
# allow the PostGIS extension (the matches table uses it).

app = "quadra-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # Staging, not Production: the fake SMS provider below is refused in Production.
  ASPNETCORE_ENVIRONMENT = "Staging"
  Database__MigrateOnStartup = "true"

  # TEMPORARY until the Twilio account exists: no SMS is sent and the code is
  # always 123456, so anyone who knows it can log in as any phone number.
  # Switch to Provider = "Twilio" (plus the Twilio secrets) before sharing the app.
  Auth__PhoneVerification__Provider = "Fake"

  # Required at startup but not used yet (events go to a no-op publisher).
  Aws__Sqs__MatchCreatedQueueUrl = "http://unused/match-created"
  Aws__Sqs__MatchStatusChangedQueueUrl = "http://unused/match-status-changed"
  Aws__Sqs__PresenceConfirmedQueueUrl = "http://unused/presence-confirmed"
  Aws__Sqs__MatchWindowOpenedQueueUrl = "http://unused/match-window-opened"
  Aws__Sqs__MatchWindowClosedQueueUrl = "http://unused/match-window-closed"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: one machine, never stopped when idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
