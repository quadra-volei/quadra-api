services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quadra-postgres
    environment:
      POSTGRES_USER: quadra
      POSTGRES_PASSWORD: quadra
      POSTGRES_DB: quadra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadra -d quadra"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
