# Render Blueprint for the Quadra API — production (quadra-api-prd, branch main).
#
# First deploy: Render dashboard → New → Blueprint → pick this repository. Render reads
# this file, asks for the values marked `sync: false`, builds the Dockerfile and deploys.
# After that, every push to the branch below redeploys automatically.
#
# Nothing else is needed: events are handled inside the API (no queue, no worker) and
# profile photos are simply disabled until an S3-compatible bucket is configured (Aws__S3__*).
#
# The database is NOT created here: Render's free Postgres expires after a few weeks.
# Use any Postgres that allows the PostGIS extension (e.g. a free Neon project in a
# US East region, close to this service) and paste its connection string when asked.
# Both `postgresql://…` URLs and Npgsql `Host=…;` strings are accepted.

services:
  - type: web
    name: quadra-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The port the container listens on (the .NET image default).
      - key: PORT
        value: "8080"

      # Production: the fixed-code Fake phone provider is refused at startup, so phone login can only
      # go through Firebase (DECISIONS #110). The test service (quadra-api-dev) keeps Staging in its
      # dashboard so the test APKs can still use the fixed code.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Take the client IP from the X-Forwarded-For entry Render's proxy appends (last hop only),
      # so the per-IP login rate limit sees each client instead of the proxy.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"

      # Apply pending EF migrations when the service boots.
      - key: Database__MigrateOnStartup
        value: "true"

      # Secrets — typed into the Render dashboard, never committed.
      - key: ConnectionStrings__Default
        sync: false
      - key: Auth__Google__ClientId
        sync: false
      # Random 256-bit key created by Render on the first deploy.
      - key: Auth__Jwt__SigningKey
        generateValue: true

      # Sentry DSN of project quadra-api (org quadra-un). Empty = Sentry off.
      - key: Sentry__Dsn
        sync: false

      # Phone login. Firebase = the app verifies the phone with Firebase Phone Auth (DECISIONS #78);
      # the only value Production accepts. Fake (fixed code, anyone logs in as any phone) is for the
      # test service only.
      - key: Auth__PhoneVerification__Provider
        sync: false
      - key: Auth__PhoneVerification__Firebase__ProjectId
        value: quadra-volei-app

      # Rede moderation: the account id (users.id, GET /api/v1/auth/me) allowed to review
      # reported posts and delete them. Add __1, __2 … for more admins.
      - key: Moderation__AdminUserIds__0
        sync: false

      # Update gate (GET /api/v1/app/version): below the minimum the app blocks with "atualize o
      # app"; below the recommended it only suggests. Empty = no requirement. Raise the minimum
      # only after the new version is live in the store.
      - key: App__MinimumVersion
        sync: false
      - key: App__RecommendedVersion
        sync: false

      # Adult-content check of uploaded photos: GoogleVision (needs the key below) or None.
      - key: Moderation__Images__Provider
        sync: false
      - key: Moderation__Images__GoogleVisionApiKey
        sync: false

      # Season pass sold on Google Play (DECISIONS #109). The JSON key of the Google Cloud service
      # account invited to the Play Console (View financial data + Manage orders). Empty = billing off:
      # the app offers nothing to buy. The price is set only on the Play Console product (passe_t1,
      # or SeasonPass__Billing__ProductIds__T1 to use another id).
      - key: SeasonPass__Billing__ServiceAccountJson
        sync: false
      # true = the paid track open to everyone (closed test without billing). false once the product
      # is active in the Play Console and the key above is set: then only buyers get it.
      - key: SeasonPass__PremiumForEveryone
        sync: false

      # Address search in "create match". Empty key = the free OpenStreetMap search (Photon).
      # Paste a Google Places API (New) key in the dashboard to switch to Google.
      - key: Places__GoogleApiKey
        sync: false

